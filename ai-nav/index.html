<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 模型导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #f48fb1, #f06292);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #ec407a, #d81b60, #ad1457);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: rgba(120, 20, 60, 0.7);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        .card-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            padding: 18px 24px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            background: rgba(255, 255, 255, 0.85);
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(233, 30, 99, 0.25);
            border-color: rgba(233, 30, 99, 0.3);
        }

        .card:active {
            transform: translateY(0);
        }

        .icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            flex-shrink: 0;
        }

        .icon.gemini { background: linear-gradient(135deg, #4285f4, #34a853); }
        .icon.chatgpt { background: linear-gradient(135deg, #10a37f, #1a8a6b); }
        .icon.deepseek { background: linear-gradient(135deg, #4f46e5, #7c3aed); }

        .info {
            flex: 1;
            text-align: left;
        }

        .info .name {
            color: #4a0020;
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .info .desc {
            color: rgba(120, 20, 60, 0.6);
            font-size: 0.85rem;
        }

        .arrow {
            color: rgba(200, 50, 100, 0.4);
            font-size: 1.2rem;
            transition: all 0.3s ease;
        }

        .card:hover .arrow {
            color: #d81b60;
            transform: translateX(4px);
        }

        .footer {
            margin-top: 2rem;
            color: rgba(120, 20, 60, 0.5);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI 模型导航</h1>
        <p class="subtitle">点击卡片跳转至对应 AI 聊天平台</p>

        <div class="card-list">
            <!-- Gemini -->
            <a class="card" href="https://aistudio.google.com/prompts/new_chat" target="_blank" rel="noopener noreferrer">
                <div class="icon gemini">✨</div>
                <div class="info">
                    <div class="name">Gemini</div>
                    <div class="desc">Google AI Studio — 免费使用 Gemini Pro</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- ChatGPT -->
            <a class="card" href="https://leopard-x.memofun.net/" target="_blank" rel="noopener noreferrer">
                <div class="icon chatgpt">💬</div>
                <div class="info">
                    <div class="name">ChatGPT</div>
                    <div class="desc">OpenAI — GPT-4o / o1 / o3 对话</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- DeepSeek 主站 -->
            <a class="card" href="https://www.deepseek.com/" target="_blank" rel="noopener noreferrer">
                <div class="icon deepseek">🌊</div>
                <div class="info">
                    <div class="name">DeepSeek</div>
                    <div class="desc">DeepSeek 官网 — 最新模型对话</div>
                </div>
                <span class="arrow">→</span>
            </a>

            <!-- DeepSeek 用量平台 -->
            <a class="card" href="https://platform.deepseek.com/usage" target="_blank" rel="noopener noreferrer">
                <div class="icon deepseek">📊</div>
                <div class="info">
                    <div class="name">DeepSeek 用量</div>
                    <div class="desc">DeepSeek 开放平台 — API 用量与账单</div>
                </div>
                <span class="arrow">→</span>
            </a>
        </div>

        <p class="footer">点击卡片即可在新标签页中打开 🔗</p>
    </div>
</body>
</html>
